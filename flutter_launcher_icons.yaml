# Launcher icons from tool/app_icon (drawn by render_icon_test.dart):
#   flutter test tool/app_icon/render_icon_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tool/app_icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "tool/app_icon/app_icon_background.png"
  adaptive_icon_foreground: "tool/app_icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "tool/app_icon/app_icon_monochrome.png"